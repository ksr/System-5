[board]
name = VIDEO-G TEXT
rev = 1.0
size = 188 x 106.565
slot_pitch = 25.4
# bus_edge: System-5's bus connector (footprint C36 since 2026-11-18: the 36-pin one, for the keyboard's choice of four EF
# lines) is not a DIN 41612, which is how pcb-check finds a bus connector, so the edge is named here; the front edge for
# Ken's layout rules is then the right-hand one. The board grew 10.375 mm at the +5V end for the six extra positions.
bus_edge = left
bus_pins = python3 ../../../../tools/s5bus.py --pins J1 --positions 36
tests = cd ../../../../software/s5emu && python3 -m unittest tests.test_videog && cd ../gbasic/tests && python3 test_gbasic.py
# the power LED labelled by its function alone, centred on it (Ken, 2026-11-18)
exempt_labels = LED1: Ken 2026-11-18, the power LED labelled by its function alone (PWR)
