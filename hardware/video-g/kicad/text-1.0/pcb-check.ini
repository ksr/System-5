[board]
name = VIDEO-G TEXT
rev = 1.0
size = 188 x 96.19
slot_pitch = 25.4
# bus_edge: System-5's 30-pin bus connector (footprint C30) is not a DIN 41612, which is how pcb-check finds a bus
# connector, so the edge is named here; the front edge for Ken's layout rules is then the right-hand one.
bus_edge = left
bus_pins = python3 ../../../../tools/s5bus.py --pins J1
tests = cd ../../../../software/s5emu && python3 -m unittest tests.test_videog && cd ../gbasic/tests && python3 test_gbasic.py
