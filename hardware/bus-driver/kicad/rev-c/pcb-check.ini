[board]
name = System-5 bus driver
rev = C
size = 139.7 x 101.6
slot_pitch = 25.4
# bus_edge: System-5's 36-pin bus connector (footprint s5bd:C36) is not a DIN 41612, which is how pcb-check finds a bus
# connector, so the edge is named here; the front edge for Ken's layout rules is then the right-hand one.
bus_edge = left
bus_pins = python3 ../../../../tools/s5bus.py --pins J1 --positions 36
# the LED labelled by its function alone, no reference (Ken, 2026-11-18, as on CPU Rev D and the IO panel)
exempt_labels = LED1: Ken 2026-11-18, the LEDs labelled by their function alone (PWR)
