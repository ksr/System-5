[board]
name = System-5 CPU
rev = D
size = 139.7 x 101.6
slot_pitch = 25.4
# bus_edge: System-5's 36-pin bus connector (footprint s5cpu:C36) is not a DIN 41612, which is how pcb-check finds a bus
# connector, so the edge is named here; the front edge for Ken's layout rules is then the right-hand one.
bus_edge = left
bus_pins = python3 ../../../../tools/s5bus.py --pins J1 --positions 36
tests = cd ../../../../software/s5emu && python3 -m unittest tests.test_hw.CPURevD tests.test_hw.Boot.test_cpu_rev_d_boots_hbios_and_echoes_a_key
# the LEDs labelled by their function alone, no reference (Ken, 2026-11-18)
exempt_labels = LED1 LED2 LED3 LED4 LED5 LED6: Ken 2026-11-18, the LEDs labelled by their function alone (PWR, Q, PAUSE, RESET, ROM; LED6 START / FROM / RAM since 2026-11-21)
