[board]
name = System-5 front panel
rev = A
size = 190.5 x 88.9
holes = 4
# The front panel hangs as the front of a case, on a ribbon from the IO panel card: it has no bus connector, so no bus
# edge, no front edge and no slot.
tests = cd ../../../../software/s5emu && python3 -m unittest tests.test_front_panel
# the panel's displays, LEDs and switches are labelled by what they show or do, without a reference or a type, as on the
# IO panel card (Ken, 2026-11-18: "remove U14 TIL-311 and others, SW1...")
exempt_labels = U1 U2 U3 U4 U5 U6: the displays by what they show (A15-A12 ... D3-D0, under ADDRESS and DATA)
    LED1 LED2 LED3 LED4 LED5 LED6 LED7 LED8: the bit LEDs by their bit number
    LED9 LED10 LED11 LED12 LED13 LED14: the status LEDs by function (PWR, Q, PAUSE, RESET, ROM, START / FROM / RAM)
    SW1 SW2 SW3 SW4 SW5 SW6 SW7 SW8 SW9 SW10 SW11 SW12: the toggles by their positions (1 / 0, RUN / RESET, LOAD / OFF), the buttons by function (INPUT, RESET)
    H1 H2 H3 H4: mounting holes
