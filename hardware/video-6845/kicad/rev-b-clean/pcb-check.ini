[board]
name = System-5 6845 video
rev = B-Clean
size = 141.0 x 96.2
slot_pitch = 25.4
# bus_edge: System-5's 30-pin bus connector (footprint C30) is not a DIN 41612, which is how pcb-check finds a bus
# connector, so the edge is named here; the front edge for Ken's layout rules is then the right-hand one.
bus_edge = left
# bus_pins is not set: this card's bus nets keep the names Eagle gave them in 2005 (ADDR0-7, CPUDATA0-7, and N$ numbers
# for the strobes), so a check by name would fail where nothing is wrong. Its pinout and its copper are Rev B's, the card
# in Ken's machine since 2005, track for track (gen/make_board.py checks every pad's net against Rev B's).
# The system's tests: the card in the hardware emulator. Rev B's netlist (tests.test_hw.Video: the machine with Rev B),
# and this board's own netlist against it, address by address (it must be Rev B on the bus).
tests = cd ../../../../software/s5emu && python3 -m unittest tests.test_hw.Video tests.test_hw_videokbd.Card.test_rev_b_clean_is_rev_b_on_the_bus
# the LED labelled by its function alone, as on the other new cards (Ken, 2026-11-18)
exempt_labels = LED1: Ken 2026-11-18, the LED labelled by its function alone (PWR), as on CPU Rev D, the IO panel and memory Rev F
