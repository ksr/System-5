[board]
name = System-5 6845 video
rev = B-Clean-Keyboard
size = 190.5 x 106.565
slot_pitch = 25.4
# bus_edge: System-5's bus connector (footprint C36) is not a DIN 41612, which is how pcb-check finds a bus connector,
# so the edge is named here; the front edge for Ken's layout rules is then the right-hand one.
bus_edge = left
# bus_pins: J1's 36 pads against the bus Rev D backplane's own pin list (tools/s5bus.py), in this card's net names
# (Rev B's, from Eagle: VCC, CPUDATA0-7, ADDR0-7); gen/buspins.py says how the pads are numbered.
bus_pins = python3 gen/buspins.py
# The system's tests: this card from its own netlist in the hardware emulator (the 6845 and the video RAM where Rev B
# has them, the 6845 write-only, the key at 7802, the status at 7804, the flag on the line JP1 picks), and the 6845 inside a
# cycle: no fight at the end of a write, nothing in a cycle with no memory access, its data sheet's times.
tests = cd ../../../../software/s5emu && python3 -m unittest tests.test_hw_crtcbus tests.test_hw_videokbd
# the LED labelled by its function alone, as on the other new cards (Ken, 2026-11-18)
exempt_labels = LED1: Ken 2026-11-18, the LED labelled by its function alone (PWR), as on CPU Rev D, the IO panel and memory Rev F
# an obsolete part in hand, so check 20 (SOURCING) passes it with the reason (Ken, 2026-11-23)
sourcing_ok = IDT7134: Ken 2026-11-23, "At least 4", for the four cards of the next order that take one
