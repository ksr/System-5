[board]
name = System-5 IO panel
rev = A
size = 190.5 x 101.6
slot_pitch = 25.4
# bus_edge: System-5's 36-pin bus connector (footprint s5io:C36) is not a DIN 41612, which is how pcb-check finds a bus
# connector, so the edge is named here; the front edge for Ken's layout rules is then the right-hand one.
bus_edge = left
bus_pins = python3 ../../../../tools/s5bus.py --pins J1 --positions 36
tests = cd ../../../../software/s5emu && python3 -m unittest tests.test_hw.IOPanel
# the LEDs, then the front panel's displays and switches, labelled by their function alone, without their reference or
# type (Ken, 2026-11-18)
exempt_labels = LED1 LED2 LED3 LED4 LED5 LED6 LED7 LED8 LED9 LED10: Ken 2026-11-18, the LEDs labelled by their function alone (BIT 0-7, Q, PWR)
    U14 U15 U16 U17 U7 U8 SW1 SW2 SW3 SW4 SW5 SW6 SW7 SW8 SW9 SW10 SW11: Ken 2026-11-18, the front panel's displays and switches labelled by their function alone (A15-A12 to OUT D3-D0, BIT 7-0, RUN/RESET, LOAD, INPUT)
