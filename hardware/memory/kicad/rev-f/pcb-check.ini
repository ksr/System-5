[board]
name = System-5 memory
rev = F
size = 141.0 x 96.2
slot_pitch = 25.4
# bus_edge: System-5's 30-pin bus connector (footprint C30) is not a DIN 41612, which is how pcb-check finds a bus
# connector, so the edge is named here; the front edge for Ken's layout rules is then the right-hand one (the LEDs).
bus_edge = left
# bus_pins is not set: this card's bus nets keep the names Eagle gave them in 2005 (BUSDATA0-7, and KiCad's Net-(...)
# for the address and strobe lines), so a check by name would fail where nothing is wrong. Its pinout is Rev E's, proven
# in the machine since 2026-10-31 (../rev-e/bringup/README.md), and the copper is Rev E's, unchanged.
tests = cd ../../../../software/s5emu && python3 -m unittest tests.test_hw.Decode
# the LEDs labelled by their function alone, as on CPU Rev D and the IO panel (Ken, 2026-11-18)
exempt_labels = LED1 LED2 LED3 LED4 LED5: Ken 2026-11-18, the LEDs labelled by their function alone (EPROM HI, EPROM LO, RAM HI, RAM LO, PWR), as on CPU Rev D and the IO panel
