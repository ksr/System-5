[board]
name = System-5 bus
rev = D
size = 244.35 x 116
# the smallest gap between slots (25.4 mm; slots 7 and 8 are 31.75 mm apart since 2026-11-18): pcb-check judges the
# tallest parts by it
slot_pitch = 25.4
# the backplane: its eight 36-pin slots (J1-J8) stand across the board, so it has no bus edge and no front edge.
# bus_pins checks every slot, position by position, against the bus definition in its own gen/netlist.py (tools/s5bus.py)
bus_pins = for j in J1 J2 J3 J4 J5 J6 J7 J8; do python3 ../../../../tools/s5bus.py --pins $j --positions 36; done
tests = cd ../../../../software/busdrv && python3 -m unittest -q test_bringup test_busboard
